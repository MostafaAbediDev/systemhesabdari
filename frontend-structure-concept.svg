  <rect width="1400" height="980" fill="url(#bg)"/>
  <text x="70" y="58" font-family="Arial" font-size="15" font-weight="700" fill="#2667ff">TAADOL • FRONTEND ARCHITECTURE CONCEPT</text>
  <text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="#0d2159">ساختار پیشنهادی Frontend</text>
  <text x="70" y="125" font-family="Arial" font-size="15" fill="#64748b">مرزبندی Featureها، کنترل‌های مشترک و لایه‌های زیرساخت UI</text>

  <g filter="url(#shadow)"><rect x="70" y="160" width="1260" height="105" rx="18" fill="url(#root)"/>
    <text x="105" y="202" class="title">Taadol</text><text x="105" y="228" class="subtitle">WPF Desktop Application • net9.0-windows</text>
    <rect x="830" y="185" width="455" height="48" rx="12" fill="#ffffff" fill-opacity=".14"/>
    <text x="858" y="215" font-family="Arial" font-size="14" fill="#fff">UI Shell + Composition Root + Navigation</text>
  </g>

