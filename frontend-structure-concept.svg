  <text x="70" y="925" font-family="Arial" font-size="13" fill="#64748b">این تصویر Conceptual است؛ برای نمایش مسیر هدف معماری تهیه شده و به‌معنای جابه‌جایی فعلی فایل‌ها نیست.</text>
