  <g filter="url(#shadow)"><rect x="1070" y="330" width="260" height="245" rx="16" class="box"/><rect x="1070" y="330" width="260" height="48" rx="16" fill="#ede9fe"/><text x="1095" y="360" class="group">Themes</text>
    <text x="1095" y="410" class="item">Styles.xaml</text><text x="1095" y="438" class="item">GridStyles.xaml</text><text x="1095" y="466" class="item">SubmenuStyles.xaml</text><text x="1095" y="510" class="small">Global visual language</text><text x="1095" y="534" class="small">and shared templates</text></g>

  <path d="M185 575 V650 M435 575 V650 M685 575 V650 M935 575 V650 M1200 575 V650 M185 650 H1200" class="line"/>

  <g filter="url(#shadow)"><rect x="70" y="680" width="1260" height="180" rx="18" fill="#fff" stroke="#d4e1ff" stroke-width="1.5"/>
    <text x="105" y="720" class="group">Dependency direction پیشنهادی</text>
    <rect x="105" y="750" width="200" height="58" rx="12" fill="#e9f0ff"/><text x="160" y="785" class="item">View</text>
    <text x="325" y="786" font-family="Arial" font-size="25" fill="#2667ff">→</text>
    <rect x="370" y="750" width="200" height="58" rx="12" fill="#e0fbec"/><text x="410" y="785" class="item">ViewModel</text>
    <text x="590" y="786" font-family="Arial" font-size="25" fill="#2667ff">→</text>
    <rect x="635" y="750" width="200" height="58" rx="12" fill="#fff8e7"/><text x="680" y="785" class="item">Application</text>
    <text x="855" y="786" font-family="Arial" font-size="25" fill="#2667ff">→</text>
    <rect x="900" y="750" width="200" height="58" rx="12" fill="#fce8ea"/><text x="960" y="785" class="item">Backend</text>
    <text x="1125" y="777" class="small">Controls فقط از contract/service</text><text x="1125" y="797" class="small">استفاده کنند، نه Repository</text>
