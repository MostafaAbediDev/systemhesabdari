<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173e99"/><stop offset="1" stop-color="#2667ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0d2159" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#fff}.subtitle{font:400 15px Arial,sans-serif;fill:#dbe7ff}
      .group{font:700 18px Arial,sans-serif;fill:#0d2159}.item{font:400 14px Arial,sans-serif;fill:#334155}
      .small{font:400 12px Arial,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#d4e1ff;stroke-width:1.5}.line{stroke:#9bb8f5;stroke-width:2;fill:none}
    </style>
